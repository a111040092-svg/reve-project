<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RE:VE | 專屬情感烏托邦</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root { --bg: #b2c7da; --yellow: #fee500; --dark: #353b41; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #111; font-family: -apple-system, sans-serif; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        #app { width: 100%; max-width: 450px; background: var(--bg); display: flex; flex-direction: column; position: relative; }
        
        /* 掃描介面 */
        #scanner-screen { position: absolute; inset: 0; background: #1a1a1a; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; }
        .logo { font-size: 40px; letter-spacing: 8px; margin-bottom: 20px; font-weight: 300; }
        #reader { width: 100%; max-width: 320px; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; border: 2px solid var(--yellow); background: #000; }
        .start-btn { margin-top: 25px; background: var(--yellow); color: #333; border: none; padding: 18px 40px; border-radius: 40px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 15px rgba(254,229,0,0.4); }
        
        /* 聊天介面 */
        #chat-ui { display: none; flex-direction: column; height: 100%; }
        header { background: var(--dark); padding: 15px; display: flex; align-items: center; justify-content: space-between; color: white; height: 70px; }
        .header-avatar { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--yellow); background: #fff; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; max-width: 85%; align-items: flex-start; }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .bubble { padding: 12px 16px; border-radius: 18px; font-size: 16px; line-height: 1.6; }
        .bot .bubble { background: white; border-top-left-radius: 2px; }
        .user .bubble { background: var(--yellow); border-top-right-radius: 2px; }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; margin: 0 10px; flex-shrink: 0; background: #fff; }
        .input-area { background: white; padding: 12px 15px; display: flex; gap: 10px; border-top: 1px solid #ddd; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
        input { flex: 1; border: 1px solid #eee; background: #f9f9f9; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 16px; }
        #send-btn { background: var(--yellow); border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>
<div id="app">
    <div id="scanner-screen">
        <div class="logo">RE:VE</div>
        <div id="reader"></div>
        <button id="cam-btn" class="start-btn" onclick="startScanner()">開啟掃描鏡頭</button>
        <p style="margin-top: 20px; color: #888; font-size: 14px;">對準成員小卡的 QR Code 即可進入</p>
        <p onclick="initChat('Edward')" style="margin-top: 20px; font-size: 12px; color: #444; text-decoration: underline;">[ 點此測試 Edward 聊天室 ]</p>
    </div>

    <div id="chat-ui">
        <header>
            <div style="display:flex; align-items:center; gap:12px;"><img src="" id="header-img" class="header-avatar"><span id="header-title" style="font-weight:bold;">Member</span></div>
            <button style="color:white; background:none; border:none;" onclick="location.reload()">退出</button>
        </header>
        <div id="chat-window"></div>
        <div class="input-area"><input type="text" id="msg-input" placeholder="想對他說什麼？"><button id="send-btn" onclick="send()">送出</button></div>
    </div>
</div>

<script>
    let html5QrCode;
    let current = '';
    const db = {
        Edward: { avatar: "https://via.placeholder.com/100/A5C9E8/fff?text=E", intro: "你好，我是 Edward。今天辛苦了，來這裡把所有的不開心都放下吧～", replies: { work: "辛苦了，不要再想工作的事了。去洗個熱水澡放鬆一下吧。過來讓我抱一個，妳已經做得很好囉～", fallback: "我在聽喔。能這樣陪著妳聊天，我就覺得很幸福了。" } },
        Rowan: { avatar: "https://via.placeholder.com/100/FFD27F/fff?text=R", intro: "嘿！寶貝！哥哥我最愛妳了！", replies: { fallback: "哥哥會一直守著妳的！" } },
        Velda: { avatar: "https://via.placeholder.com/100/D1B3FF/fff?text=V", intro: "我是 Velda。我在聽。😐", replies: { fallback: "萬事有我。😌" } }
    };

    async function startScanner() {
        const btn = document.getElementById('cam-btn');
        btn.innerText = "正在啟動鏡頭...";
        html5QrCode = new Html5Qrcode("reader");
        try {
            await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                const name = text.trim();
                if(db[name]) {
                    html5QrCode.stop().then(() => initChat(name));
                }
            });
            btn.style.display = 'none';
        } catch (err) {
            alert("⚠️ 錯誤：瀏覽器封鎖了相機！請點選網址列左邊的鎖頭圖示，並開啟「相機」權限，然後重新整理。");
            btn.innerText = "重新開啟鏡頭";
        }
    }

    function initChat(name) {
        current = name;
        document.getElementById('scanner-screen').style.display = 'none';
        document.getElementById('chat-ui').style.display = 'flex';
        document.getElementById('header-title').innerText = name;
        document.getElementById('header-img').src = db[name].avatar;
        addBubble(db[name].intro, 'bot');
    }

    function send() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if(!text) return;
        addBubble(text, 'user');
        input.value = "";
        setTimeout(() => {
            let type = text.match(/累|工作|上班|死/) ? 'work' : 'fallback';
            addBubble(db[current].replies[type] || db[current].replies.fallback, 'bot');
        }, 800);
    }

    function addBubble(t, type) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        const avatar = type === 'bot' ? `<img src="${db[current].avatar}" class="chat-avatar">` : '';
        div.innerHTML = `${avatar}<div class="bubble">${t}</div>`;
        win.appendChild(div); win.scrollTop = win.scrollHeight;
    }
</script>
</body>
</html>
